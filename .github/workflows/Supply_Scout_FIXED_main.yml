name: Supply Scout - Daily Evidence Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

concurrency:
  group: supply-scout-evidence
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search public news and update archive
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, urlopen

          now = dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds')
          WATCH = {
              'Memory chips': '(DRAM OR HBM OR NAND) (shortage OR "capacity constrained" OR backlog)',
              'Optical networks': '(optical OR transceiver OR photonics) (shortage OR "capacity constrained" OR backlog)',
              'Grid equipment': '(transformer OR switchgear) (shortage OR "lead time" OR backlog)',
              'Copper': 'copper (shortage OR "supply deficit" OR "mine disruption")',
              'Shipping': '(shipping OR freight OR container) (shortage OR congestion OR "rates surge")',
          }
          TERMS = re.compile(
              r'\b(shortage|scarcity|shortfall|backlog|capacity constrain\w*|'
              r'supply constrain\w*|supply deficit|lead.time\w*|sold.out|'
              r'congestion|freight rates|prices? surge\w*)\b', re.I)
          EASING = re.compile(
              r'\b(oversupply|shortage eases|supply normaliz\w*|'
              r'prices? (?:fall|decline))\b', re.I)
          path = Path('data/archive.json')
          try:
              archive = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
              if not isinstance(archive, list):
                  archive = []
          except (ValueError, OSError):
              archive = []
          seen = {(item.get('theme'), item.get('url')) for item in archive}
          added, errors = 0, []
          for theme, query in WATCH.items():
              params = urlencode({
                  'query': query, 'mode': 'artlist', 'format': 'json',
                  'timespan': '7d', 'maxrecords': 75})
              try:
                  request = Request(
                      'https://api.gdeltproject.org/api/v2/doc/doc?' + params,
                      headers={'User-Agent': 'SupplyScout/0.2 PublicResearch'})
                  with urlopen(request, timeout=35) as response:
                      payload = json.loads(response.read(3000000).decode('utf-8'))
                  articles = payload.get('articles', [])
                  if not isinstance(articles, list):
                      raise ValueError('GDELT returned no article list')
                  for item in articles:
                      title = str(item.get('title') or '').strip()
                      url = str(item.get('url') or '').strip()
                      if not title or not url.startswith(('https://', 'http://')):
                          continue
                      if not TERMS.search(title) and not EASING.search(title):
                          continue
                      key = (theme, url)
                      if key in seen:
                          continue
                      seen.add(key)
                      archive.append({
                          'theme': theme,
                          'headline': title,
                          'url': url,
                          'domain': urlparse(url).netloc,
                          'first_seen_by_agent_at': now,
                          'gdelt_seen_at': item.get('seendate'),
                          'published_at_verified': None,
                          'flags': ['Headline scarcity signal'],
                          'easing': bool(EASING.search(title)),
                          'classification': 'unverified headline - research only'
                      })
                      added += 1
              except Exception as exc:
                  errors.append(theme + ': ' + type(exc).__name__ + ': ' + str(exc))
              time.sleep(1)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(archive[-2000:], indent=2, ensure_ascii=False), encoding='utf-8')
          print('Archived:', len(archive[-2000:]), 'new:', added, 'feed errors:', len(errors))
          for error in errors:
              print('FEED WARNING:', error)
          if errors and added == 0:
              print('No new headlines: feed may be unavailable; no results fabricated.')
          PY
      - name: Commit evidence without replacing PWA website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Supply Scout: archive new public signals'
            git push
          fi
