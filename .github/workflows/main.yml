name: Supply Scout - Free Daily Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: supply-scout-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan public evidence and build dashboard
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import re
          import time
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, urlopen
          
          now = dt.datetime.now(dt.timezone.utc)
          timestamp = now.isoformat(timespec="seconds")
          watch = {
              "Memory chips": ('(DRAM OR HBM OR NAND) (shortage OR "capacity constrained" OR "lead time" OR "prices surge")', ["MU", "SNDK"]),
              "Optical networks": ('(optical OR transceiver OR photonics) (shortage OR "capacity constrained" OR "sold out" OR "backlog")', ["LITE", "COHR"]),
              "Grid equipment": ('(transformer OR switchgear) (shortage OR "lead times" OR "capacity constrained")', ["ETN", "HUBB"]),
              "Copper": ('copper (shortage OR "supply deficit" OR "mine disruption")', ["FCX"]),
              "Shipping": ('(shipping OR containers OR freight) (shortage OR "capacity constraints" OR congestion)', ["ZIM"]),
          }
          patterns = {
              "Scarcity": r'\b(shortage|scarcity|shortfall|supply deficit|supply constrain\w*|capacity constrain\w*)\b',
              "Backlog": r'\b(backlog|lead.times?|delivery delay\w*|fully booked|sold out)\b',
              "Pricing": r'\b(price\w* (?:surge|spike|rise|increase)|cost\w* (?:surge|spike)|higher prices)\b',
              "Demand": r'\b(demand (?:surge|jump|boom)|orders? (?:surge|jump))\b',
          }
          reversal = re.compile(r'\b(oversupply|shortage eases|supply normaliz\w*|prices? (?:fall|decline))\b', re.I)
          path = Path('data/archive.json')
          try:
              archive = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
              if not isinstance(archive, list): archive=[]
          except (ValueError, OSError):
              archive=[]
          known = {(r.get('theme'), r.get('url')) for r in archive}
          new = []
          errors = []
          for theme,(query,tickers) in watch.items():
              params = urlencode({'query':query,'mode':'artlist','format':'json','timespan':'7d','maxrecords':'75'})
              try:
                  req = Request('https://api.gdeltproject.org/api/v2/doc/doc?'+params, headers={'User-Agent':'SupplyScout/0.1 Research'})
                  with urlopen(req, timeout=35) as response:
                      payload=json.loads(response.read(3000000))
                  if not isinstance(payload,dict): raise ValueError('Unexpected response')
                  for article in payload.get('articles',[]):
                      headline=str(article.get('title') or '')
                      url=str(article.get('url') or '')
                      if not headline or not url.startswith(('http://','https://')) or (theme,url) in known:continue
                      flags=[name for name,pattern in patterns.items() if re.search(pattern,headline,re.I)]
                      ease=bool(reversal.search(headline))
                      if not flags and not ease:continue
                      known.add((theme,url))
                      new.append({'theme':theme,'headline':headline,'url':url,'domain':urlparse(url).netloc,
                          'first_seen_by_agent_at':timestamp,'gdelt_seen_at':article.get('seendate'),
                          'published_at_verified':None,'flags':flags,'easing':ease,
                          'classification':'unverified headline, not investment advice'})
              except Exception as exc:
                  errors.append(f'{theme}: {type(exc).__name__}: {exc}')
              time.sleep(1)
          archive.extend(new)
          archive=archive[-2000:]
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(archive,ensure_ascii=False,indent=2),encoding='utf-8')
          groups=defaultdict(list)
          for row in archive:
              groups[row['theme']].append(row)
          escape=lambda x:html.escape(str(x),quote=True)
          cards=[]
          for theme,(query,tickers) in watch.items():
              rows=sorted(groups[theme],key=lambda r:r.get('first_seen_by_agent_at',''),reverse=True)
              active=[r for r in rows if r.get('first_seen_by_agent_at','')[:10]>=((now-dt.timedelta(days=7)).date().isoformat())]
              domains=len({r['domain'] for r in active})
              flags={f for r in active for f in r.get('flags',[])}
              has_relief=any(r.get('easing') for r in active)
              score=min(85,max(0,10+min(len(active),6)*5+min(domains,4)*5+min(len(flags),4)*6-(15 if has_relief else 0))) if active else 0
              links=''.join('<a href="'+escape(r['url'])+'" target="_blank" rel="noopener noreferrer">'+escape(r['headline'][:150])+'<small>'+escape(r['domain'])+' Â· First seen '+escape(r.get('first_seen_by_agent_at','')[:10])+'</small></a>' for r in rows[:6])
              status='Unverified easing reports present' if has_relief else ('No matching headlines yet' if not rows else 'Claims require original-source verification')
              cards.append('<article><div class="top"><h2>'+escape(theme)+'</h2><strong>'+str(score)+'/85</strong></div><p>Research tickers: '+escape(', '.join(tickers))+'</p><p>'+str(len(active))+' archived signals in last 7 days Â· '+str(domains)+' source domains</p><p>'+escape(status)+'</p>'+links+'</article>')
          status='PARTIAL / FEED ERRORS' if errors else 'LIVE DISCOVERY â UNVERIFIED'
          style="""body{margin:0;background:#081322;color:#f1f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;padding:32px 18px;margin:auto}.ey{color:#6ce7be;letter-spacing:2px;font-size:12px;font-weight:750}h1{font-size:clamp(33px,7vw,55px);letter-spacing:-1.5px;margin:18px 0 8px}h2{font-size:20px;margin:0}p{color:#9eafc3;line-height:1.55}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article,.notice{background:#101f32;border:1px solid #2a435d;border-radius:15px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.top strong{font-size:20px;color:#6ce7be}a{display:block;text-decoration:none;color:#e6f6ff;border-top:1px solid #254056;padding:12px 0;line-height:1.3}small{display:block;color:#91a7bc;font-size:11px;margin-top:5px}.tag{border:1px solid #36566b;border-radius:20px;padding:8px 12px;font-size:12px;display:inline-block;color:#6ce7be}.notice{margin-top:17px;color:#9eafc3}footer{color:#869db3;font-size:12px;padding:22px 0}@media(max-width:650px){section{grid-template-columns:1fr}article{padding:16px}}"""
          from pathlib import Path
          Path('docs').mkdir(exist_ok=True)
          page='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081322"><title>Supply Scout</title><style>'+style+'</style></head><body><main><div class="ey">SUPPLY SCOUT / EARLY-WARNING RESEARCH</div><h1>Find the bottleneck.<br>Before the consensus.</h1><p><span class="tag">'+escape(status)+'</span></p><p>Live, source-linked supply chain news leads. Scores indicate headline-research priority, not investment returns or probabilities.</p><section>'+''.join(cards)+'</section><div class="notice"><b>Last scan:</b> '+escape(timestamp)+' UTC. '+str(len(archive))+' articles archived. '+str(len(new))+' added this scan.<p><b>Feed errors:</b> '+(escape(' | '.join(errors)) if errors else 'None reported')+'</p><p>Claims are unverified; headlines can be duplicated or misleading. Stock tickers are watchlist hypotheses, not confirmed beneficiaries. Not a trained predictor. No trading orders. Source publication dates have NOT been independently validated.</p></div><footer>Free GitHub Actions + Pages Â· Supply Scout prototype Â· Research only</footer></main></body></html>'
          Path('docs/index.html').write_text(page,encoding='utf-8')
          Path('docs/latest.json').write_text(json.dumps({'scan':timestamp,'count':len(new),'total_archive':len(archive),'errors':errors,'data_mode':'unverified_live_headlines'},indent=2),encoding='utf-8')
          print('Supply Scout:', len(new), 'new signals,', len(errors), 'feed errors')
          PY
      - name: Preserve new archive on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json docs/index.html docs/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Supply Scout: refresh evidence"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
