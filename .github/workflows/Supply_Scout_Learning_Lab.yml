          def main():
           OUT.mkdir(parents=True,exist_ok=True)
           rows=load_archive()
           clusters=make_clusters(rows)
           themes=summary(rows,clusters)
           data,rejected=load_verified()
           meta=train_if_ready(data,rejected)
           state={'built_at':NOW.isoformat(timespec='seconds'),'archive_count':len(rows),'cluster_count':len(clusters),'dates_first_seen':len({r['first_seen'].date() for r in rows if r['first_seen']}),'data_quality':{'all_current_archive_unverified':True,'historical_dates_are_not_agent_first_seen':True,'model_is_not_return_probability':True},'themes':themes,'model':meta,'historical_case_research_leads':RESEARCH_HISTORIES}
           (OUT/'learning_state.json').write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
           make_html(state)
           print('Learning:',len(rows),'headlines,',len(clusters),'clusters,',meta['independent_episodes'],'verified episodes; model:',meta['prediction_model'])
           if not rows:print('WARNING: no article archive. Check the daily RSS scanner before interpreting any score.')
           return state
          
          if __name__=='__main__':main()
