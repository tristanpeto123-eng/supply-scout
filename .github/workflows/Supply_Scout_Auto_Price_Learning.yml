# Supply Scout autonomous price-outcome learning — no trading, no paid API key.
# Upload this ONE YAML file into .github/workflows/ on the main branch.
# Results are committed to data/learning and a separate price-learning.html dashboard.
name: Supply Scout - Automatic Price Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * *'

permissions:
  contents: write

concurrency:
  group: supply-scout-price-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout evidence archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free adjusted market price reader
        run: python -m pip install -q 'yfinance>=0.2.58,<1.0'
      - name: Update next-session market outcomes and guarded learning model
        shell: bash
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Supply Scout automated, price-outcome research loop.

          This labels MARKET RETURNS, not the factual truth or cause of a supply shortage.
          Does not trade. Does not use any outcome features in its own signal snapshot.
          """
          import datetime as dt
          import html
          import json
          import math
          import os
          import re
          import statistics
          from pathlib import Path

          ROOT = Path('.')
          ARCHIVE = ROOT / 'data/archive.json'
          EVENTS = ROOT / 'data/learning/price_events.json'
          STATUS = ROOT / 'data/learning/price_status.json'
          MODEL = ROOT / 'data/learning/price_model.json'
          PAGE = ROOT / 'price-learning.html'
          BENCHMARK = 'ACWI'  # USD total-return-adjusted proxy for global listed equities
          ROUND_TRIP_COST = 0.006  # illustrative: 0.6% including FX and trading friction
          HORIZONS = (7, 30, 90)
          CANDIDATES = {
            'Memory chips': ('MU', r'\b(?:dram|hbm|ddr\d?|ram|memory|micron|nand|ssd|semiconductor)\b'),
            'Optical networks': ('LITE', r'\b(?:optical|transceiver|photonics|lumentum|laser|datacenter interconnect)\b'),
            'Grid equipment': ('ETN', r'\b(?:transformer|switchgear|grid|substation|electrical transmission|eaton|power equipment)\b'),
            'Copper': ('FCX', r'\b(?:copper|mine|smelter|metal supply)\b'),
            'Shipping': ('ZIM', r'\b(?:shipping|freight|container|vessel|port|maritime|cargo)\b'),
          }
          SIGNALS = {
            'scarcity': r'\b(?:shortage|scarcity|shortfall|supply deficit|capacity constrain\w*|supply constrain\w*|sold out|tight supply)\b',
            'lead_times': r'\b(?:backlog|lead.time\w*|delivery delay\w*|fully booked|fully allocated|port congestion|shipping congestion|freight congestion)\b',
            'pricing': r'\b(?:price\w* (?:surge|spike|rise|increase)|higher prices|price increase|cost\w* (?:surge|spike)|freight rates? (?:surge|spike|rise|increase))\b',
            'demand': r'\b(?:demand (?:surge|jump|boom|outpace)|orders? (?:surge|jump)|capacity expansion|data.center boom)\b',
            'easing': r'\b(?:oversupply|shortage eases|supply normaliz\w*|prices? (?:fall|decline)|lead times? (?:fall|shorten))\b',
          }
          REG = {k:re.compile(p,re.I) for k,p in SIGNALS.items()}
          THR_POS, THR_NEG = 0.05, 0.0
          FEATURES = ['scarcity','lead_times','pricing','demand','easing','n_reports','publisher_count','publication_lag','prior_excess_30d']
          NOW = dt.datetime.now(dt.timezone.utc)

          def iso_time(x):
              try:
                  v=dt.datetime.fromisoformat(str(x).replace('Z','+00:00'))
                  if v.tzinfo is None:return v.replace(tzinfo=dt.timezone.utc)
                  return v.astimezone(dt.timezone.utc)
              except (ValueError, TypeError):return None

          def load(path,default):
              try:
                  x=json.loads(path.read_text(encoding='utf-8'))
                  return x if isinstance(x,type(default)) else default
              except (ValueError,OSError):return default

          def write(path,x):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(x,indent=2,ensure_ascii=False,allow_nan=False)+'\n',encoding='utf-8')

          def detect(row):
              theme=row.get('theme')
              if theme not in CANDIDATES:return None
              title=str(row.get('headline') or '').strip()
              if not title or not re.search(CANDIDATES[theme][1],title,re.I):return None
              ts=iso_time(row.get('first_seen_by_agent_at'))
              if not ts or ts>NOW+dt.timedelta(minutes=10):return None
              d={k:int(bool(v.search(title))) for k,v in REG.items()}
              if not any(d.values()):return None
              return ts,title,d

          def make_events(archive, prior):
              """Create one non-overlapping frozen evidence snapshot per theme/week.
              Existing features never grow as later articles arrive (point-in-time).
              """
              current={x['id']:x for x in prior if isinstance(x,dict) and x.get('id')}
              by_group={}
              for row in archive:
                  parsed=detect(row)
                  if not parsed:continue
                  ts,title,tags=parsed
                  theme=row['theme'];symbol=CANDIDATES[theme][0]
                  week=ts.date().isocalendar();key=f'{theme}|{symbol}|{week.year}-W{week.week:02d}'
                  by_group.setdefault(key,[]).append((ts,row,title,tags))
              for key,items in by_group.items():
                  if key in current:continue
                  items.sort(key=lambda x:(x[0],x[1].get('url','')))
                  # Only articles independently present by the first observed timestamp belong to the snapshot.
                  first=items[0][0]
                  initial=[x for x in items if x[0]<=first+dt.timedelta(seconds=1)]
                  pubs={str(x[1].get('domain','')) for x in initial}
                  days=[]
                  for _,r,_,_ in initial:
                      pub=iso_time(r.get('feed_publication_at'))
                      if pub and pub<=first:days.append(max(0,(first-pub).total_seconds()/86400))
                  feats={name:int(any(x[3][name] for x in initial)) for name in SIGNALS}
                  feats.update({'n_reports':len(initial),'publisher_count':len(pubs),
                                'publication_lag':round(min(days),2) if days else None,
                                'prior_excess_30d':None})
                  theme,symbol,_=key.split('|',2)
                  current[key]={
                    'id':key,'theme':theme,'ticker':symbol,'proxy_not_confirmed_beneficiary':True,
                    'signal_time':first.isoformat(timespec='seconds'),'snapshot_locked':True,
                    'headline':initial[0][2],'source_url':initial[0][1].get('url'),
                    'source_domain':initial[0][1].get('domain'),
                    'features':feats,'market':{'status':'PENDING_MARKET_DATA'},'outcomes':{},
                    'research_note':'Sector proxy only; no claim that a shortage is proven or caused returns.'
                  }
              return sorted(current.values(),key=lambda x:(x.get('signal_time',''),x.get('id','')))

          def series_for(ticker,begin,end):
              """Yahoo adjusted daily historical OHLC; skip explicitly on errors/empty response."""
              import yfinance as yf
              frame=yf.Ticker(ticker).history(start=begin.isoformat(), end=end.isoformat(),
                                              interval='1d',auto_adjust=True,actions=False,timeout=18)
              if frame is None or frame.empty or 'Close' not in frame or 'Open' not in frame:
                  raise RuntimeError(f'No dividend/split-adjusted OHLC history for {ticker}')
              rows={}
              for ix,row in frame.iterrows():
                  try:
                      day=ix.date();op=float(row['Open']);cl=float(row['Close'])
                      if op>0 and cl>0 and math.isfinite(op) and math.isfinite(cl):rows[day]={'open':op,'close':cl}
                  except (ValueError,TypeError,KeyError):continue
              if len(rows)<2:raise RuntimeError(f'Insufficient adjusted OHLC history for {ticker}')
              return rows

          def get_prices(events):
              if not events:return {},[]
              start=min(iso_time(e['signal_time']).date() for e in events)-dt.timedelta(days=55)
              # Fetch only last 2.5 years; old events are frozen and their matured outcomes persist.
              start=max(start,NOW.date()-dt.timedelta(days=900))
              end=NOW.date()+dt.timedelta(days=2)
              symbols=sorted({e['ticker'] for e in events if iso_time(e.get('signal_time')) and iso_time(e['signal_time']).date()>start}|{BENCHMARK})
              prices={};errors=[]
              for symbol in symbols:
                  try:prices[symbol]=series_for(symbol,start,end)
                  except Exception as exc:errors.append(f'{symbol}: {type(exc).__name__}: {str(exc)[:240]}')
              return prices,errors

          def first_day_after(days,stamp):
              candidates=[d for d in days if d>stamp]
              return min(candidates) if candidates else None

          def first_day_atleast(days,target):
              candidates=[d for d in days if d>=target]
              return min(candidates) if candidates else None

          def last_day_before(days,stamp):
              options=[d for d in days if d<stamp]
              return max(options) if options else None

          def update_price_outcomes(events,prices):
              for e in events:
                  timestamp=iso_time(e.get('signal_time'))
                  if not timestamp:continue
                  stock=prices.get(e['ticker']);bench=prices.get(BENCHMARK)
                  if not stock or not bench:
                      e['market']={'status':'MISSING_ADJUSTED_PRICES','benchmark':BENCHMARK};continue
                  days=sorted(set(stock)&set(bench))
                  sigday=timestamp.date()
                  # Last available close STRICTLY BEFORE signal calendar day; avoids same-day hindsight.
                  past=last_day_before(days,sigday)
                  older=last_day_before(days,sigday-dt.timedelta(days=30))
                  if e['features'].get('prior_excess_30d') is None and past and older:
                      e['features']['prior_excess_30d']=round((stock[past]['close']/stock[older]['close']-1)-(bench[past]['close']/bench[older]['close']-1),6)
                  entry=first_day_after(days,sigday)
                  if entry is None:
                      e['market']={'status':'WAITING_FOR_NEXT_TRADING_SESSION'};continue
                  # Assume entry at NEXT session adjusted OPEN, after signal was public.
                  entry_stock=stock[entry]['open'];entry_bench=bench[entry]['open']
                  e['market']={'status':'TRACKING','entry_date':entry.isoformat(),
                               'price_source':'Yahoo Finance via yfinance',
                               'price_basis':'split/dividend adjusted Open and Close',
                               'benchmark':BENCHMARK,'round_trip_cost':ROUND_TRIP_COST}
                  for h in HORIZONS:
                      prev=e['outcomes'].get(str(h),{})
                      if prev.get('status')=='RESOLVED':continue
                      target=entry+dt.timedelta(days=h)
                      if NOW.date()<target+dt.timedelta(days=5):
                          e['outcomes'][str(h)]={'status':'PENDING','target_date':target.isoformat()};continue
                      exitday=first_day_atleast(days,target)
                      if exitday is None or exitday>target+dt.timedelta(days=6):
                          e['outcomes'][str(h)]={'status':'DATA_UNAVAILABLE','target_date':target.isoformat()};continue
                      r_stock=stock[exitday]['close']/entry_stock-1
                      r_bench=bench[exitday]['close']/entry_bench-1
                      excess=r_stock-r_bench-ROUND_TRIP_COST
                      label=('OUTPERFORM' if excess>THR_POS else ('UNDERPERFORM' if excess<=THR_NEG else 'NEUTRAL'))
                      e['outcomes'][str(h)]={'status':'RESOLVED','exit_date':exitday.isoformat(),
                        'stock_return_pct':round(r_stock*100,2), 'benchmark_return_pct':round(r_bench*100,2),
                        'excess_after_cost_pct':round(excess*100,2),'label':label,
                        'known_after':exitday.isoformat(), 'source':'adjusted market prices; does not prove physical shortage'}
              return events

          def vector(e):
              f=e['features']
              return [float(f.get(z) if f.get(z) is not None else 0) for z in FEATURES]

          def auc_simple(labels,scores):
              pos=[s for y,s in zip(labels,scores) if y==1];neg=[s for y,s in zip(labels,scores) if y==0]
              if not pos or not neg:return None
              return sum(1 if a>b else (0.5 if a==b else 0) for a in pos for b in neg)/(len(pos)*len(neg))

          def sigmoid(v):
              z=max(-25,min(25,v));return 1/(1+math.exp(-z))

          def fit_logistic(train):
              """Tiny deterministic L2-regularised logistic baseline; no external ML package."""
              xs=[vector(e) for e in train];ys=[1 if e['outcomes']['90']['label']=='OUTPERFORM' else 0 for e in train]
              mu=[statistics.mean(col) for col in zip(*xs)];sd=[statistics.pstdev(col) or 1 for col in zip(*xs)]
              zx=[[max(-6,min(6,(v-m)/s)) for v,m,s in zip(row,mu,sd)] for row in xs]
              w=[0.0]*len(mu);b=math.log((sum(ys)+1)/(len(ys)-sum(ys)+1))
              n=len(ys)
              for _ in range(1600):
                  gs=[0.0]*len(w);gb=0
                  for row,y in zip(zx,ys):
                      err=sigmoid(sum(a*c for a,c in zip(w,row))+b)-y
                      gb+=err
                      for j,v in enumerate(row):gs[j]+=err*v
                  rate=0.09
                  for j in range(len(w)):w[j]-=rate*(gs[j]/n+0.15*w[j])
                  b-=rate*gb/n
              return {'mean':mu,'scale':sd,'coefficients':w,'intercept':b},lambda x:sigmoid(sum(wi*max(-6,min(6,(xi-mi)/si)) for wi,xi,mi,si in zip(w,vector(x),mu,sd))+b)

          def train_if_ready(events):
              resolved=[e for e in events if e.get('outcomes',{}).get('90',{}).get('status')=='RESOLVED'
                        and e['outcomes']['90'].get('label') in ('OUTPERFORM','UNDERPERFORM')
                        and e['features'].get('prior_excess_30d') is not None]
              resolved.sort(key=lambda x:x['signal_time'])
              distinct=len({e['id'] for e in resolved})
              pos=sum(e['outcomes']['90']['label']=='OUTPERFORM' for e in resolved)
              neg=len(resolved)-pos
              out={'status':'LOCKED','matured_90d_non_neutral':len(resolved),'distinct_cohorts':distinct,
                   'positive':pos,'negative':neg,'min_required':80,
                   'note':'Outcome labels are market performance, not shortage truth or proof of causality.'}
              if len(resolved)<80 or pos<20 or neg<20 or len({e['theme'] for e in resolved})<3:
                  out['reason']='Require at least 80 distinct, matured sector-week outcomes, 20 winners, 20 losers, across at least 3 themes.'
                  return out
              # Holdout last 20%, temporal 90-day embargo prevents overlapping outcome windows.
              split=max(1,int(len(resolved)*0.8));test=resolved[split:]
              test_start=iso_time(test[0]['signal_time'])
              train=[e for e in resolved[:split] if iso_time(e['signal_time'])<test_start-dt.timedelta(days=90)]
              if len(train)<50 or len({e['outcomes']['90']['label'] for e in train})<2 or len({e['outcomes']['90']['label'] for e in test})<2:
                  out['reason']='Chronological 90-day-embargoed train/holdout split has insufficient usable observations or outcome classes.'
                  return out
              params,predict=fit_logistic(train)
              labels=[int(e['outcomes']['90']['label']=='OUTPERFORM') for e in test]
              probs=[predict(e) for e in test]
              brier=sum((p-y)**2 for p,y in zip(probs,labels))/len(labels)
              baseline=sum(int(e['outcomes']['90']['label']=='OUTPERFORM') for e in train)/len(train)
              basebrier=sum((baseline-y)**2 for y in labels)/len(labels)
              out.update({'status':'EVALUATED_NOT_LIVE_TRADING','training_rows':len(train),'holdout_rows':len(test),
                          'holdout_auc':round(auc_simple(labels,probs),3),
                          'holdout_brier':round(brier,4),'base_rate_brier':round(basebrier,4),
                          'parameters':dict(params,feature_names=FEATURES),
                          'note':'Prototype outcome classifier evaluated on a chronological embargoed holdout. Not calibrated or proven profitable.'})
              return out

          def render(events,status,model):
              esc=lambda s:html.escape(str(s),quote=True)
              def pct(n):return str(n)+'%' if n is not None else '—'
              rows=[]
              for e in reversed(events[-45:]):
                  out=e.get('outcomes',{}).get('90',{}); s=out.get('status','PENDING')
                  value=(pct(out.get('excess_after_cost_pct'))+' excess') if s=='RESOLVED' else 'Pending 90d'
                  color='#7af0c8' if out.get('label')=='OUTPERFORM' else '#ffc28c' if out.get('label')=='UNDERPERFORM' else '#a4b6cb'
                  rows.append(f'<article><div class="line"><strong>{esc(e["theme"])} <small>{esc(e["ticker"])}</small></strong><b style="color:{color}">{esc(value)}</b></div><p>{esc(e["headline"][:210])}</p><div class="tiny">First detected {esc(e["signal_time"][:10])} · Next-session entry {esc(e.get("market",{}).get("entry_date","pending"))}</div><a href="{esc(e.get("source_url") or "#")}" target="_blank" rel="noopener noreferrer">Source report →</a></article>')
              resolved=sum(e.get('outcomes',{}).get('90',{}).get('status')=='RESOLVED' for e in events)
              pending=len(events)-resolved
              errors=' | '.join(status['market_data_errors']) if status['market_data_errors'] else 'None'
              css='''*{box-sizing:border-box}body{margin:0;background:#09121d;color:#f0f7fd;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:920px;margin:auto;padding:28px 17px 85px}.ey{font-weight:750;font-size:11px;letter-spacing:2px;color:#7af0c8}h1{font-size:clamp(32px,7vw,52px);letter-spacing:-1.4px;margin:12px 0}p{color:#a9bbcb;line-height:1.55}.metric{padding:17px;background:#12253a;border:1px solid #2e4961;border-radius:15px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.metric b{display:block;font-size:25px;margin-top:7px}.metric span,.tiny,small{color:#9badbf;font-size:12px}article,.notice{padding:19px;border:1px solid #2e4961;background:#102036;border-radius:15px;margin:12px 0}.line{display:flex;justify-content:space-between;gap:14px;align-items:center}.line strong{font-size:16px}article p{font-size:14px}a{color:#85dfd1;text-decoration:none;display:inline-block;margin-top:10px}h2{font-size:20px;margin:25px 0 13px}.notice{overflow-wrap:anywhere}.warn{color:#ffc28c}@media(max-width:500px){.metric{padding:10px}.metric b{font-size:21px}.line{flex-wrap:wrap}article{padding:15px}}'''
              doc=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09121d"><title>Supply Scout — Price Learning</title><style>{css}</style></head><body><main><div class="ey">SUPPLY SCOUT / AUTONOMOUS OUTCOME TRACKING</div><h1>Did the market reward the signal?</h1><p>Tracks the NEXT US trading session's adjusted open through 7, 30 and 90 calendar days, using adjusted closing prices and the global-equity benchmark {BENCHMARK}. Automatically labels outcomes — not whether the physical shortage was factual.</p><div class="metrics"><div class="metric"><span>Tracked sector-weeks</span><b>{len(events)}</b></div><div class="metric"><span>90d resolved</span><b>{resolved}</b></div><div class="metric"><span>Awaiting outcome</span><b>{pending}</b></div></div><div class="notice"><strong>Training gate: {esc(model['status'])}</strong><p>{esc(model.get('reason') or model.get('note'))}</p><p class="tiny">Benchmark: {BENCHMARK} · Outcome label: stock excess return > +5% after 0.6% estimated costs (win), 0% or below (loss), otherwise neutral. No actual orders are placed.</p></div><h2>Signal cohorts and prices</h2>{''.join(rows) if rows else '<div class="notice">No trackable signals yet.</div>'}<div class="notice"><strong>Run diagnostics</strong><p>Last attempt: {esc(status['last_attempt_at'])} UTC · Adjusted-pricing errors: <span class="warn">{esc(errors)}</span></p><p>Company tickers are sector proxies, not proven beneficiaries. Model comparisons are associative, not causal. Outcomes need elapsed time and functioning market data; missing prices never become wins or losses. Signal features are frozen at first observation to prevent future information leaking backwards.</p><p><a href="data/learning/price_status.json">Raw diagnostics</a> · <a href="data/learning/price_events.json">Outcome dataset</a> · <a href="learning.html">Learning Lab</a> · <a href="index.html">Radar</a></p></div></main></body></html>'''
              PAGE.write_text(doc,encoding='utf-8')

          def main():
              archive=load(ARCHIVE,[])
              prior=load(EVENTS,[])
              events=make_events(archive,prior)
              prices,errs=get_prices(events)
              events=update_price_outcomes(events,prices)
              model=train_if_ready(events)
              status={'last_attempt_at':NOW.isoformat(timespec='seconds'),'tracked_cohorts':len(events),
                      'market_data_errors':errs,'symbols_with_adjusted_prices':sorted(prices),
                      'outcomes_90d_resolved':sum(e.get('outcomes',{}).get('90',{}).get('status')=='RESOLVED' for e in events),
                      'pipeline_status': 'PARTIAL_PRICE_DATA' if errs else 'OK',
                      'prediction_model':model['status'],
                      'warning':'A positive share-price return does not verify a physical shortage. No trades are made.'}
              write(EVENTS,events);write(STATUS,status);write(MODEL,model);render(events,status,model)
              print(json.dumps({k:status[k] for k in ['tracked_cohorts','market_data_errors','symbols_with_adjusted_prices','outcomes_90d_resolved','pipeline_status','prediction_model']},indent=2))

          if __name__=='__main__':main()
          PY
      - name: Commit automated labels and market dashboard
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/learning/price_events.json data/learning/price_status.json data/learning/price_model.json price-learning.html; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Supply Scout: update price-outcome labels and learning state'
            git push
          fi
